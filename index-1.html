function TC(k){return PAL[Object.keys(T).indexOf(k)%PAL.length]}
const STU={3:["Kajal Yadav","Amit Ranjan|45","Fatima Khatoon","Sujata Yadav","Amrita Kumari|18","Sweta Yadav","Saleha Khatoon|11","Saloni Patel","Avinashe Patel","Mohammad Husain|33","Aditya Gupta","Niranjan Patel","Annu Gupta","Roshani Maddheshiya","Aasvi Bharti","Dixita Gupta","Shambhu Gautam","Achal Kumari","Vivek Yadav|43","Muskan Chaudhari","Meena Bharti","Mahira Khatoon","Satyam Gupta"]};
const PAR={"Kajal Yadav":["Santosh Yadav","Geeta Devi"],"Amit Ranjan":["Upendra Chauhan"],"Fatima Khatoon":["Wajid Ali","Sanjida Khatoon"],"Sujata Yadav":["Omprakash Yadav","Menika Devi"],"Amrita Kumari":["Rambelash Madheshiya"],"Sweta Yadav":["Omprakash Yadav","Menika Devi"],"Saleha Khatoon":["Hafij Ansari"],"Saloni Patel":["Yogesh Patel","Rajkumari Devi"],"Avinashe Patel":["Yogesh Patel","Rajkumari Devi"],"Mohammad Husain":["Shahid Ansari"],"Aditya Gupta":["Raju Gupta","Sabita Devi"],"Niranjan Patel":["Ashok Patel","Poonam Devi"],"Annu Gupta":["Triloki Gupta","Babeeta Devi"],"Roshani Maddheshiya":["Jitendra","Pushpa Devi"],"Aasvi Bharti":["Ashok Prasad","Gyanti Devi"],"Dixita Gupta":["Vijay Kumar Gupta","Parvati Devi"],"Shambhu Gautam":["Krishnamohan Gautam","Sunita Devi"],"Achal Kumari":["Moti Prasad","Manju Devi"],"Vivek Yadav":["Raju Yadav"],"Muskan Chaudhari":["Bablu Prasad","Urmila Devi"],"Meena Bharti":["Satan Prasad","Rajkali Devi"],"Mahira Khatoon":["Ishan Ansari","Husna Khatoon"],"Satyam Gupta":["Munnilal Gupta","Fuljhei Devi"]};
function openStu(c){const a=STU[c];$("sc").innerHTML='<div class="gr"></div><h3>Class '+C[c]+' · Students ('+a.length+')</h3><div>'+a.map((s,i)=>{const[n,r]=s.split("|"),p=PAR[n]||[];return `<div class="stu"><span>${i+1}</span><div style="flex:1"><b>${n}</b><small style="display:block;line-height:1.5">${p[0]?"पिता: "+p[0]:""}${p[0]&&p[1]?" · ":""}${p[1]?"माता: "+p[1]:""}</small></div><em>${r?"Roll "+r:""}</em></div>`}).join("")+'</div><button onclick="$(\'sh\').classList.remove(\'on\')">बंद करें</button>';$("sh").classList.add("on")}
function go(v){st.v=v;if(v==="teacher"&&ME)st.t=ME;draw();scrollTo(0,0)}
function setMe(k){ME=k;try{k?localStorage.setItem("me",k):localStorage.removeItem("me")}catch(e){}if(k)st.t=k;draw()}
function homeView(){
if(!ME||!T[ME])return '<h3 class="hd">👋 Aap kaun hain?</h3><div class="band">Apna naam chuniye</div><div class="qa">'+Object.keys(T).filter(k=>k!=="X").map(k=>`<button class="tcb" style="--tc:${TC(k)}" onclick="setMe('${k}')">${T[k]}</button>`).join("")+'</div>';
const m=new Date(),now=m.getHours()*60+m.getMinutes(),mine=S.filter(p=>p.c&&p.c.some(x=>x.t===ME)),tp=S.filter(p=>p.c).length,cls=new Set();
mine.forEach(p=>p.c.forEach((x,j)=>{if(x.t===ME)cls.add(j)}));
const myCT=C.filter((c,j)=>CT[j]===T[ME]),desc=p=>p.c.map((x,j)=>x.t===ME?C[j]+" "+x.s:null).filter(Boolean)[0];
const run=mine.find(p=>now>=p.s&&now<p.e),nx=mine.find(p=>p.s>now);let big="—",sub="Aaj ke periods poore ho gaye";
if(run){big="Period "+run.n;sub="Abhi: "+desc(run)}else if(nx){big="Period "+nx.n;sub="Agla: "+nx.t.split("–")[0]+" · "+desc(nx)}
const ini=T[ME].split(" ").map(w=>w[0]).join(""),tile=(e,l,f,c)=>`<button onclick="${f}"><i style="background:${c}">${e}</i>${l}</button>`;
return `<div class="wl"><div class="av">${ini}</div><div><small>Welcome back,</small><h2>${T[ME]}</h2><span class="pill">${myCT.length?"Class Teacher · "+myCT.join(", "):"Teacher"}</span></div></div>
<div class="big"><div class="tp"><span class="ch">📅 ${m.toLocaleDateString("en-IN",{weekday:"long"})}</span><span class="ch">${mine.length} Periods</span></div><div class="mt">${big}</div><div class="ms">${sub}</div>
<div class="g4"><div><b>${mine.length}</b><span>Periods</span></div><div><b>${tp-mine.length}</b><span>Free</span></div><div><b>${cls.size}</b><span>Classes</span></div><div><b>${myCT[0]||"—"}</b><span>Class T.</span></div></div>
<button class="vd" onclick="go('teacher')">View Details ›</button></div>
<h3 class="hd">Quick Actions</h3><div class="qa">${tile("🗓️","My Table","go('teacher')","#ebe8ff")}${tile("🏫","Class View","go('class')","#ccfbf1")}${tile("📋","Full Table","go('grid')","#fef3c7")}${tile("🟢","Free Teachers","go('free')","#dcfce7")}${tile("📚","Syllabus","go('syl')","#fce7f3")}${tile("📢","Notice","go('notice')","#ffedd5")}${tile("📝","Exam","go('exam')","#e0f2fe")}${tile("📤","WhatsApp","go('teacher');shareWA()","#dcfce7")}${tile("👤","Teacher badlein","setMe(null)","#f1f5f9")}</div>`}
function freeView(){const ps=S.map((p,i)=>[p,i]).filter(([p])=>p.c);if(st.fp==null){const ci=cur();st.fp=ci>=0&&S[ci].c?ci:ps[0][1]}
let o='<div class="chips">'+ps.map(([p,i])=>`<button class="${st.fp===i?"on":""}" onclick="st.fp=${i};draw()">${p.n}</button>`).join("")+'</div>';
const p=S[st.fp],bz=new Set(p.c.map(x=>x.t)),fr=Object.keys(T).filter(k=>k!=="X"&&!bz.has(k));
o+=`<div class="stats"><div class="st"><b>${fr.length}</b><span>Free</span></div><div class="st"><b>${p.t}</b><span>Period ${p.n}</span></div></div>`;
return o+(fr.length?fr.map(k=>`<div class="row k7 tcr" style="--k:${TC(k)}"><div class="p"><strong>${p.n}</strong>${p.t}</div><div class="m"><b>${T[k]}</b><span>Free</span></div></div>`).join(""):'<div class="band">Is period me koi teacher free nahi hai.</div>')}
function infoView(w){if(!w)return menuView();const B='<button class="btn" onclick="go(\'info\')">‹ Back</button>';let o='<h3 class="hd">📢 Notice</h3>'+(NOTICES.length?NOTICES.map(n=>`<div class="row k0"><div class="m"><b>${n.t}</b><span>${n.d||""}</span></div></div>`).join(""):'<div class="band">Abhi koi suchna nahi hai.</div>');
o+='<h3 class="hd">📝 Exam Datesheet</h3>'+(EX.length?`<div class="gw"><table style="min-width:0"><tr><th>Date</th><th>Class</th><th>Subject</th></tr>${EX.map(e=>`<tr><td>${e.d}</td><td>${e.c}</td><td>${e.s}</td></tr>`).join("")}</table></div>`:'<div class="band">Datesheet abhi nahi judi hai.</div>');
o+='<h3 class="hd">📚 Syllabus Progress</h3>'+Object.keys(CH).sort((a,b)=>b-a).map(c=>`<div class="row k2 clk2" onclick="openCh(${c})"><div class="p"><strong>${C[c]}</strong>Science</div><div class="m"><b>${CHS(c)}</b><span>${CH[c].map(x=>x.st==="done"?"✅":x.st==="next"?"⏭️":"🟢").join(" ")} · ${T.PR}</span></div></div>`).join("");
return B+'<h3 class="hd">'+o.split('<h3 class="hd">')[{n:1,e:2,s:3}[w]]}
function menuView(){const r=(i,l,n,v)=>`<div class="row k0 m${i} clk2" onclick="go('${v}')"><div class="m"><b>${l}</b><span>${n}</span></div></div>`;return r(1,"Notice",NOTICES.length+" suchna","notice")+r(2,"Exam Datesheet",EX.length+" exam","exam")+r(3,"Syllabus",Object.keys(CH).length+" classes","syl")+'<h3 class="hd">⚙️ Settings</h3><button class="btn" onclick="setLg()">🌐 '+LN[LG]+'</button><button class="btn" onclick="shareWA()">📤 WhatsApp</button><div class="band">Home screen: Chrome ⋮ → Add to Home screen</div>'}
function shareWA(){let t="🏫 Pankaj Higher Secondary School\n";
if(st.v==="class"){t+="📅 Class "+C[st.c]+" Time Table\n";S.forEach(p=>{if(p.c){const x=p.c[st.c];t+=p.n+" ("+p.t+"): "+x.s+" - "+T[x.t]+"\n"}})}
else if(st.v==="teacher"){t+="👤 "+T[st.t]+"\n";S.forEach(p=>{if(p.c){const a=p.c.map((x,j)=>x.t===st.t?C[j]+" "+x.s:null).filter(Boolean);t+=p.n+" ("+p.t+"): "+(a.join(", ")||"Free")+"\n"}})}
t+="\n"+location.href;window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
function openCh(c){$("sc").innerHTML='<div class="gr"></div><h3>Class '+C[c]+' · Science</h3><small>👤 '+T.PR+'</small>'+CH[c].map(x=>`<div class="ci ${x.st}"><span>${x.sub}</span><b>अध्याय ${x.no}</b><div>${x.name}</div><em>${SN[x.st]}</em></div>`).join("")+'<button onclick="$(\'sh\').classList.remove(\'on\')">बंद करें</button>';$("sh").classList.add("on")}
const $=id=>document.getElementById(id);
function cur(){const d=new Date(),m=d.getHours()*60+d.getMinutes();return S.findIndex(p=>m>=p.s&&m<p.e)}
function tick(){
const d=new Date(),i=cur();
$("clk").textContent=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
let h;
if(i<0)h="<b>Abhi</b>School time (9:00 AM – 2:15 PM) ke bahar hai (chhutti).";
else{const p=S[i];
 if(p.prayer)h="<b>Abhi</b>🙏 Prayer ("+p.t+")";
 else if(p.lunch)h="<b>Abhi</b>🍱 Lunch Time ("+p.t+")";
 else if(p.zero)h="<b>Abhi · Zero Bell ("+p.t+")</b>Sabhi teachers class lekar Discipline aur Language maintain karein.";
 else if(st.v==="teacher"){const a=p.c.map((x,j)=>x.t===st.t?C[j]+" – "+x.s:null).filter(Boolean);h="<b>Abhi · Period "+p.n+" ("+p.t+")</b>"+T[st.t]+": "+(a.length?a.join(", "):"Free period")}
 else{const x=p.c[st.c];h="<b>Abhi · Period "+p.n+" ("+p.t+") · Class "+C[st.c]+"</b>"+x.s+" — "+T[x.t]}}
$("now").innerHTML=h;tr()}
function tabs(){
$("tabs").innerHTML=[["home","🏠<br>Home"],["class","🏫<br>Class"],["teacher","👩‍🏫<br>Teacher"],["free","🟢<br>Free"],["info","📢<br>Info"]].map(([k,l])=>`<button class="${st.v===k||(k==="info"&&["notice","exam","syl"].includes(st.v))?"on":""}" onclick="st.v='${k}';draw()">${l}</button>`).join("");
let h="";
if(st.v==="class")h=C.map((c,i)=>`<button class="${st.c===i?"on":""}" onclick="st.c=${i};draw()">${c}</button>`).join("");
if(st.v==="teacher")h=Object.keys(T).filter(k=>k!=="X").map(k=>`<button class="tcb ${st.t===k?"on":""}" style="--tc:${TC(k)}" onclick="st.t='${k}';draw()">${T[k]}</button>`).join("");
$("sel").innerHTML=h?`<div class="chips">${h}</div>`:""}
function band(p,i){return `<div class="band ${cur()===i?"cur":""}">${p.lunch?"🍱 Lunch":"🙏 Prayer"} · ${p.t}</div>`}
function classView(){
let o=`<div class="stats"><div class="st"><b>${C[st.c]}</b><span>Class</span></div><div class="st"><b>${new Set(S.filter(p=>p.c).map(p=>p.c[st.c].t)).size}</b><span>Teachers</span></div><div class="st"><b>${S.filter(p=>p.c).length}</b><span>Periods</span></div><div class="st"><b>${CT[st.c]||"—"}</b><span>Class Teacher</span></div></div>${STU[st.c]?`<div class="row k3 clk2 m4" onclick="openStu(${st.c})"><div class="m"><b>Students (${STU[st.c].length})</b><span>Class ke bachchon ki list</span></div></div>`:""}`;
S.forEach((p,i)=>{if(!p.c){o+=band(p,i);return}const x=p.c[st.c],h=x.t==="PR"&&CH[st.c];
o+=`<div class="row ${K(x.s)} ${cur()===i?"cur":""} ${h?"clk2":""}"${h?` onclick="openCh(${st.c})"`:""}><div class="p"><strong>${p.n}</strong>${p.t}</div><div class="m"><b>${x.s}</b><span>👤 ${T[x.t]}</span>${h?`<em class="bd">📖 ${CHS(st.c)} · tap karein</em>`:""}</div></div>`});
return o}
function teacherView(){
let n=0,o="",rows="";
S.forEach((p,i)=>{if(!p.c){rows+=band(p,i);return}
const cl=p.c.map((x,j)=>x.t===st.t?{c:C[j],s:x.s,j}:null).filter(Boolean);
if(cl.length){n++;const h=st.t==="PR"&&CH[cl[0].j];rows+=`<div class="row ${K(cl[0].s)} ${cur()===i?"cur":""} ${h?"clk2":""}"${h?` onclick="openCh(${cl[0].j})"`:""}><div class="p"><strong>${p.n}</strong>${p.t}</div><div class="m"><b>${cl.map(x=>x.c).join(" + ")}</b><span>${cl[0].s}</span>${h?`<em class="bd">📖 ${CHS(cl[0].j)} · tap karein</em>`:""}</div></div>`}
else rows+=`<div class="row free ${cur()===i?"cur":""}"><div class="p"><strong>${p.n}</strong>${p.t}</div><div class="m"><b>Free</b></div></div>`});
o=`<div class="stats"><div class="st"><b>${n}</b><span>Periods</span></div><div class="st"><b>${7-n}</b><span>Free</span></div></div>`;
return o+rows}
function grid(){
const ci=cur();
let o=`<div class="gw"><table><tr><th>Period</th>${C.map(c=>`<th>${c}</th>`).join("")}</tr>`;
S.forEach((p,i)=>{
if(!p.c){o+=`<tr class="${ci===i?"cur":""}"><td>${p.n}<br><small>${p.t}</small></td><td class="lz" colspan="11">${p.lunch?"L U N C H – T I M E":"P R A Y E R"}</td></tr>`;return}
o+=`<tr class="${ci===i?"cur":""}"><td>${p.n}<br><small>${p.t}</small></td>`;
for(let j=0;j<11;j++){const x=p.c[j],y=p.c[j+1];let sp=1;const h=x.t==="PR"&&CH[j];
 if(y&&y.t===x.t&&y.s===x.s&&j<10){sp=2}
 o+=`<td colspan="${sp}"${h?` class="hl2" onclick="openCh(${j})"`:""}><b>${x.s}</b><i>${T[x.t]}</i>${h?`<i>📖 ${CHN(j)}</i>`:""}</td>`;if(sp===2)j++}
o+="</tr>"});
return o+"</table></div>"}
function draw(){tabs();$("nb").innerHTML=NOTICES.length?`<div class="nbn">📢 ${NOTICES[0].t}</div>`:"";$("now").style.display=st.v==="home"?"none":"";$("out").innerHTML={home:homeView,class:classView,teacher:teacherView,grid,free:freeView,info:infoView,notice:()=>infoView("n"),exam:()=>infoView("e"),syl:()=>infoView("s")}[st.v]();tick()}
draw();setInterval(tick,30000);
</script>
</body>
</html>
